<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Owie - Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="owie-status">
  <div class="shell">
    <div class="subhead">
      <a class="back" href="/">&lsaquo; Status</a>
      <span class="ap">%DISPLAY_AP_NAME%</span>
    </div>
    <h1 class="ptitle">Settings</h1>

    <form method="post" action="/settings" id="settingsForm">
      <fieldset>
        <legend>Owie WiFi</legend>
        <label class="flabel" for="apselfname">Network name override</label>
        <input id="apselfname" placeholder="WiFi network name" value="%AP_SELF_NAME%" name="apselfname">
        <label class="flabel" for="pw">Password</label>
        <input id="pw" placeholder="Between 8 and 31 characters" value="%AP_PASSWORD%" name="pw">
        <label class="flabel" for="wifipower">Transmit power (dBm)</label>
        <select id="wifipower" value="%WIFI_POWER%" name="wifipower">
          %WIFI_POWER_OPTIONS%
        </select>
      </fieldset>

      <fieldset>
        <legend>Board locking</legend>
        <p class="note" id="lockingMsg"></p>
        <button class="btn" onclick="toggleArming(this)" id="armBtn" style="display:none"
          data-canenable="%CAN_ENABLE_LOCKING%" data-enabled="%LOCKING_ENABLED%">
          Disabled
        </button>
      </fieldset>

      <fieldset>
        <legend>Firmware update</legend>
        <p class="note">Select a firmware file to flash it over WiFi.</p>
        <input id="updInput" type="file" name="firmware" accept=".bin,.bin.gz">
      </fieldset>

      <button class="btn primary">Save settings</button>
    </form>

    <div class="actions" style="margin-top:14px">
      <a class="btn" href="/dev_settings">Developer settings</a>
    </div>

    <script>
      (() => {
        document.getElementById("updInput").onchange = () => {
          const form = document.getElementById("settingsForm");
          form.setAttribute("enctype", "multipart/form-data");
          const oldAction = form.getAttribute("action");
          form.setAttribute("action", "/update");
          form.submit();
          form.setAttribute("action", oldAction);
        };

        const cannotLockMsg = "First set WiFi password above and save settings to enable board locking.";
        const lockingEnabledMsg = "Locking is enabled! To lock the board, turn it on and off in less than 5 seconds.";
        const lockingDisabledMsg = "Locking is disabled."
        const btn = document.getElementById("armBtn");
        const lockingMsg = document.getElementById("lockingMsg");
        if (!btn.dataset.canenable) {
          lockingMsg.innerText = cannotLockMsg;
          return;
        }
        btn.removeAttribute('style');

        function updateButton() {
          const isEnabled = !!btn.dataset.enabled;
          btn.removeAttribute("disabled");
          lockingMsg.innerText = isEnabled ? lockingEnabledMsg : lockingDisabledMsg;
          btn.innerText = isEnabled ? "Disable locking" : "Enable locking";
        }
        updateButton();

        btn.onclick = () => {
          const xhr = new XMLHttpRequest();
          xhr.open("GET", "/lock?toggleArm");
          xhr.resposeType = "text";

          xhr.onload = () => {
            if (xhr.readyState !== xhr.DONE || xhr.status !== 200) {
              btn.innerText = "Error: " + xhr.status;
            } else {
              btn.dataset.enabled = xhr.responseText;
              updateButton();
            }
          };
          btn.setAttribute("disabled", "1");
          xhr.send();
        }
      })();
    </script>
  </div>
</body>

</html>
