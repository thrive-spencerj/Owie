<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Owie - Firmware Update</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="owie-status">
  <div class="shell">
    <h1 class="ptitle">Firmware update</h1>
    <form method="post" action="/update" enctype="multipart/form-data">
      <fieldset>
        <legend>Upload firmware</legend>
        <p class="note">Choose a firmware <b>.bin</b> file. Flashing begins immediately and
          takes about 30 seconds &mdash; keep the board powered on the whole time.</p>
        <input type="file" name="firmware" accept=".bin,.bin.gz" onchange="this.form.submit()">
      </fieldset>
    </form>
  </div>
</body>

</html>
