<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Owie - WiFi</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="owie-status">
    <div class="shell">
        <div class="subhead">
            <a class="back" href="/dev_settings">&lsaquo; Developer settings</a>
            <span class="ap">%DISPLAY_AP_NAME%</span>
        </div>
        <h1 class="ptitle">WiFi</h1>

        <form method="post">
            <fieldset>
                <legend>Join a network</legend>
                <p class="note">Owie can also connect to your home WiFi as a client.</p>
                <label class="flabel" for="ssid">Network to connect to</label>
                <input id="ssid" placeholder="Type or select your WiFi network" value="%SSID%" name="s">
                <label class="flabel" for="pass">Password</label>
                <input id="pass" type="password" placeholder="Enter your WiFi password" value="%PASS%" name="p">
            </fieldset>
            <button class="btn primary">Save</button>
        </form>
    </div>
</body>

</html>
